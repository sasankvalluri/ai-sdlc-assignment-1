[project]
name = "reminder-agent"
version = "0.1.0"
description = "Natural-language reminder parser with a 3-layer evaluation harness (Assignment 1 Part 1B)."
authors = [
    { name = "Sasank Valluri", email = "aga4code@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.26.0",
    "openai>=3.46.0",
    "pydantic>=2.14.3",
    "python-dateutil>=4.0.0",
]

[project.scripts]
reminder = "reminder_agent.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", "evidence", ".harness"]
addopts = "-ra"

[tool.ruff]
exclude = ["evidence", ".venv"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.coverage.run]
source = ["src/reminder_agent"]
branch = true
