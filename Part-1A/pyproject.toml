[project]
name = "smart-todo-cli"
version = "0.1.0"
description = "Deterministic command-line task manager (Assignment 1 Part 1A)."
authors = [
    { name = "Sasank Valluri", email = "aga4code@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
smart-todo = "smart_todo.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
# Snapshots live under evidence/; keep them out of discovery to prevent
# duplicate conftest conflicts (harness-run 20261107T173051Z, G3).
testpaths = ["tests"]
norecursedirs = [".venv", "evidence", ".harness"]
addopts = "-ra"

[tool.ruff]
# Same reason as pytest: evidence/ holds immutable snapshots.
exclude = ["evidence", ".venv"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.coverage.run]
source = ["src/smart_todo"]
branch = true
